name: Deploy to Render

# Render's own "auto-deploy on commit" never fires for this repo, so GitHub tells
# Render to deploy instead, using the service's Deploy Hook URL stored as the
# secret RENDER_DEPLOY_HOOK (Render -> service -> Settings -> Deploy Hook).

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows: ["BusinessesForSale sweep"]   # data commits by the bot don't trigger push events
    types: [completed]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy the latest commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set; skipping. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$HOOK")
          echo "Render answered HTTP $code"
          cat /tmp/resp.txt; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

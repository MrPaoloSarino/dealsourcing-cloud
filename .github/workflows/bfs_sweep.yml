name: BusinessesForSale sweep

on:
  schedule:
    - cron: "17 */4 * * *"    # every 4 hours (Manila 12:17am/4/8am, 12:17pm/4/8pm): newest 20 pages
    - cron: "41 18 * * 6"     # weekly, Sun 02:41 Manila: full crawl of every page
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to fetch (25 listings each). 0 = all pages"
        required: false
        default: "20"
  push:
    branches: [main]
    paths: ["bfs/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: bfs-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide how many pages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_PAGES: ${{ github.event.inputs.pages }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then P="${INPUT_PAGES:-20}"
          elif [ "$EVENT" = "schedule" ] && [ "$CRON" = "41 18 * * 6" ]; then P=0
          elif [ "$EVENT" = "push" ] && echo "$COMMIT_MSG" | grep -q "\[full\]"; then P=0
          elif [ "$EVENT" = "push" ]; then P=3
          else P=20; fi
          echo "pages=$P" >> "$GITHUB_OUTPUT"
          echo "Fetching pages: $P (0 = all)"

      - name: Scrape BusinessesForSale (saves progress every 50 pages)
        run: >
          python bfs/scrape_bfs.py --pages "${{ steps.plan.outputs.pages }}"
          --checkpoint-every 50
          --checkpoint-cmd "bash scripts/save_data.sh 'BusinessesForSale data (crawl in progress)'"

      - name: Save final data to the deal screen
        if: always()
        run: |
          [ -f out/bfs_listings.csv ] || { echo "No results file"; exit 0; }
          bash scripts/save_data.sh "Update BusinessesForSale data"

      - name: Upload run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bfs-results
          path: out/
          retention-days: 7

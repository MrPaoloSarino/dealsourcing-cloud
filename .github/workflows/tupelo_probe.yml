name: Tupelo probe (one-off)
on:
  push:
    branches: [main]
    paths: ["tupelo/probe.py", ".github/workflows/tupelo_probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python tupelo/probe.py

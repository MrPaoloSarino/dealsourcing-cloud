name: BusinessesForSale cloud test

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      pages:
        description: "Pages to fetch (25 listings each). 0 = all pages"
        required: false
        default: "1"
  push:
    branches: [main]          # also runs once when you first upload the files

jobs:
  scrape-bfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape BusinessesForSale (plain HTTP, no browser)
        run: python bfs/scrape_bfs.py --pages "${{ github.event.inputs.pages || '1' }}"

      - name: Diagnose page 1 structure
        if: always()
        run: python bfs/diagnose_page.py out/page1.html || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bfs-results
          path: out/
          retention-days: 14

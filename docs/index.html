<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal screen · BusinessesForSale</title>
<style>body{margin:0;font:15px/1.5 "Segoe UI",sans-serif;background:#F4F6F3;color:#5E6B64}p{padding:32px}</style>
</head>
<body>
<p id="msg">Loading the deal screen…</p>
<script>
// The deal screen itself lives in the GitHub repo (docs/app.html). This page fetches
// the latest version on every visit, so updates show up without the host redeploying.
// If GitHub can't be reached, it falls back to the copy deployed next to this page.
(async () => {
  const sources = [
    "https://raw.githubusercontent.com/MrPaoloSarino/dealsourcing-cloud/refs/heads/main/docs/app.html?t=" + Date.now(),
    "app.html",
  ];
  for (const url of sources) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      const html = await res.text();
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (_) { /* try the next source */ }
  }
  document.getElementById("msg").textContent =
    "The deal screen couldn't be loaded. Check your connection and refresh the page.";
})();
</script>
</body>
</html>

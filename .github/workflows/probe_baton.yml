name: Probe Baton (temporary)
on:
  push:
    branches: [probe-baton]
    paths: ["probe/probe.py", ".github/workflows/probe_baton.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install curl_cffi
      - run: python probe/probe.py
      - run: |
          git config user.name dealsourcing-bot
          git config user.email dealsourcing-bot@users.noreply.github.com
          git add probe && git commit -qm "Probe results" && git push -q
